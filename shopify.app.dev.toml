# Keha Inventory Intelligence — DEVELOPMENT app config (a separate dev app in
# the Partner Dashboard, so `shopify app dev` never touches production URLs).
# Use: shopify app config use shopify.app.dev.toml && shopify app dev
# Keep scopes, webhooks and api_version identical to shopify.app.toml.

client_id = "697e77fbed7c47e1736b0393ba94c9dd"
name = "Keha Inventory (dev)"
handle = "keha-inventory-dev"
application_url = "https://example.com"
embedded = true

[access_scopes]
scopes = "read_products,read_inventory,read_locations,read_locales,read_reports,read_inventory_purchase_orders,write_inventory_transfers,write_discounts"

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = [ "app/scopes_update" ]
uri = "/webhooks/app/scopes_update"

# Data sync (spec §6.5): stock now, catalog and locations. Scopes: read_inventory,
# read_products, read_locations. No orders/* webhooks (sales come from ShopifyQL).
[[webhooks.subscriptions]]
topics = [ "inventory_levels/update" ]
uri = "/webhooks/inventory_levels/update"

[[webhooks.subscriptions]]
topics = [ "products/update" ]
uri = "/webhooks/products/update"

[[webhooks.subscriptions]]
topics = [ "products/delete" ]
uri = "/webhooks/products/delete"

[[webhooks.subscriptions]]
topics = [ "locations/create" ]
uri = "/webhooks/locations/create"

[[webhooks.subscriptions]]
topics = [ "locations/update" ]
uri = "/webhooks/locations/update"

[[webhooks.subscriptions]]
topics = [ "locations/delete" ]
uri = "/webhooks/locations/delete"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "/webhooks/shop/redact"

[build]
# Dev only: the CLI points the dev app at the tunnel.
automatically_update_urls_on_dev = true

[sidekick]
# Same as shopify.app.toml (tests/sidekick-extension.test.ts).
extensions_summary = "Look up stock planning data from Keha Inventory Intelligence: reorder plans by supplier with order-by dates and cash needed, product stock and days left, open purchase orders, this week's stock actions, money at stake and forecast accuracy."
