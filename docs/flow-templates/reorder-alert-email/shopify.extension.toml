# Flow TEMPLATE extension — NOT DEPLOYED YET. Template for the trigger "Product needs reorder" + Flow's "Send internal email".
# Copy this folder to extensions/reorder-alert-email/ only together with the workflow exported from the Flow app
# as template.flow (docs/FLOW-TEMPLATES.md step 3): `shopify app deploy` fails without the module
# file, and tests/flow-extensions.test.ts refuses a flow_template extension without it.
# Generate the extension with `shopify app generate extension` (Flow Template) first and keep the
# uid line the CLI writes; replace the rest with this file.

[[extensions]]
name = "t:name"
type = "flow_template"
# uid = "<keep the uid the CLI generated>"
handle = "reorder-alert-email"
description = "t:description"

  [extensions.template]
  categories = ["inventory_and_merch"]
  module = "./template.flow"
  require_app = false
  discoverable = true
  enabled = true
